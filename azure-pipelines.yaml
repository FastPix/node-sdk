trigger:
  - feature/*

pool:
  vmImage: ubuntu-latest

variables:
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)  # Ensure this is defined
    steps:
    - task: SonarCloudPrepare@1
      displayName: 'Prepare SonarQube Analysis'
      inputs:
        SonarCloud: 'sdk_sonar'
        organization: 'fastpix'
        cliProjectKey: 'FastPix_nodejs-sdk'
        projectName: 'nodejs-sdk'
        scannerMode: 'CLI'
        configMode: 'manual'
        extraProperties: |
          sonar.projectKey=FastPix_nodejs-sdk
          sonar.projectName=nodejs-sdk

    - task: SonarCloudAnalyze@1
      displayName: 'Run SonarQube Code Analysis'
      
    - task: SonarCloudPublish@1
      displayName: 'Publish SonarQube Quality Gate Results'
      inputs:
        pollingTimeoutSec: '300'
